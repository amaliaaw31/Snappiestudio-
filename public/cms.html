<!doctype html>
<html lang="id">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex, nofollow">
  <title>Login CMS — Snappie Studio</title>
  <link rel="stylesheet" href="/cms.css">
</head>
<body>
  <main>
    <div class="brand">Snappie Studio</div>
    <h1>Login CMS</h1>
    <p class="sub">Masuk untuk melihat jumlah dan lokasi pengunjung.</p>
    <form id="login" class="login">
      <label for="username">Username admin</label>
      <input id="username" name="username" value="admin" autocomplete="username" required>
      <label for="password">Password admin</label>
      <input id="password" name="password" type="password" autocomplete="current-password" required>
      <button id="login-submit" type="submit">Masuk</button>
    </form>
    <p id="status" role="status"></p>
    <p class="note">Password tidak disimpan di browser. Sesi berakhir setelah 30 menit tidak aktif atau saat keluar.</p>
  </main>
  <script type="module" src="/cms-login.js"></script>
</body>
</html>
